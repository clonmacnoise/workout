<!DOCTYPE html>
<!-- saved from url=(0070)file:///Users/jamesmurphy/Documents/Claude/Projects/My%20Health/w.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<title>Workout Program</title>
<link href="./Workout Program_files/css2" rel="stylesheet">
<style>
  [hidden] { display: none !important; }
  .cloud-panel { padding: 14px 16px; background: #17171c; border-bottom: 1px solid #303038; }
  .cloud-panel p { font-size: 13px; line-height: 1.5; margin: 0 0 9px; color: #b4b4c1; }
  .cloud-panel label { display:block; font-size:13px; margin-bottom:8px; }
  .cloud-panel input { display:block; width:100%; margin-top:8px; padding:10px; color:#f0eff4; background:#0e0e10; border:1px solid #555560; border-radius:8px; font-size:16px; }
  .cloud-panel button { padding:9px 12px; border:1px solid #555560; border-radius:8px; background:#232328; color:#f0eff4; font:inherit; font-size:13px; cursor:pointer; }
  .cloud-panel button:disabled { opacity:.5; cursor:default; }
  .cloud-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .cloud-panel a { color:#b6afff; }
  .empty-history { color:#b4b4c1; line-height:1.5; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0e0e10;
    color: #f0eff4;
    font-family: 'DM Sans', sans-serif;
    padding: 0 0 40px;
  }

  .header {
    position: sticky;
    top: 0;
    background: #0e0e10;
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }

  .header-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .header-sub {
    font-size: 13px;
    color: #888894;
    font-family: 'DM Mono', monospace;
  }

  .cycle-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .cycle-label {
    font-size: 12px;
    color: #888894;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .cycle-track {
    flex: 1;
    height: 4px;
    background: #232328;
    border-radius: 4px;
    overflow: hidden;
  }

  .cycle-fill {
    height: 100%;
    border-radius: 4px;
    background: #7f77dd;
    transition: width 0.4s ease;
  }

  .cycle-count {
    font-size: 12px;
    color: #7f77dd;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .status-item {
    min-width: 0;
    padding: 9px 10px;
    border-radius: 12px;
    background: #1a1a1e;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .status-label {
    display: block;
    font-size: 10px;
    color: #555560;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }

  .status-value {
    display: block;
    color: #f0eff4;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }

  .status-value.good { color: #48c59b; }
  .status-value.warn { color: #ef9f27; }
  .status-value.performance-high { color: #48c59b; }
  .status-value.performance-medium { color: #ef9f27; }
  .status-value.performance-low { color: #d85a30; }

  .consistency-message {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(29,158,117,0.12);
    border: 1px solid rgba(72,197,155,0.2);
    color: #48c59b;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }

  .content { padding: 16px; }

  .day-heading {
    font-size: 13px;
    font-weight: 500;
    color: #888894;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .done-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    background: rgba(29,158,117,0.12);
    color: #1d9e75;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .missed-badge {
    background: rgba(239,159,39,0.12);
    color: #ef9f27;
  }

  .pending-badge {
    background: rgba(127,119,221,0.12);
    color: #a9a4ec;
  }

  .block-card {
    background: #1a1a1e;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
    /* will-change lets the GPU prep the layer for animation */
    will-change: transform, opacity;
  }

  .block-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .block-badge {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
  }

  .badge-A { background: rgba(127,119,221,0.15); color: #7f77dd; }
  .badge-B { background: rgba(29,158,117,0.12); color: #1d9e75; }
  .badge-C { background: rgba(239,159,39,0.12); color: #ef9f27; }
  .badge-D { background: rgba(216,90,48,0.12); color: #d85a30; }

  .block-label {
    font-size: 12px;
    color: #888894;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  .block-sets {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: #888894;
    background: #232328;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .exercise-row {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .exercise-row:last-child { border-bottom: none; }

  .ex-name {
    font-size: 15px;
    font-weight: 500;
    color: #f0eff4;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .ex-chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .chip-weight { background: rgba(127,119,221,0.12); color: #a9a4ec; }
  .chip-reps { background: #232328; color: #888894; }
  .chip-note { background: rgba(29,158,117,0.12); color: #48c59b; }

  .complete-area {
    padding: 20px 0 4px;
  }

  .btn-complete {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s ease;
    background: #7f77dd;
    color: #fff;
    letter-spacing: -0.2px;
  }

  .btn-complete:active { transform: scale(0.97); }

  .btn-complete.is-done {
    background: #1e1e22;
    color: #555560;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .btn-complete.is-done:active {
    background: #2a2a30;
    color: #888894;
  }

</style>
</head>
<body>

<section class="cloud-panel" aria-label="Private history">
  <p id="syncStatus" role="status" aria-live="polite">Connect to load your private history.</p>
  <form id="connectionForm">
    <label for="accessKey">GitHub access key<input id="accessKey" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
    <p>Your key stays in this browser session. Your history lives in your private GitHub repository. <a href="./CLOUD_SETUP.md" target="_blank" rel="noopener">Connection setup</a></p>
    <button id="connectButton" type="submit">Connect private history</button>
  </form>
  <div class="cloud-actions">
    <button id="syncButton" type="button" disabled>Sync now</button>
    <button id="startButton" type="button" hidden>Start new history · September 11</button>
    <button id="backupButton" type="button" disabled>Save backup</button>
    <button id="reviewButton" type="button" hidden>Use saved cloud history</button>
    <button id="disconnectButton" type="button" hidden>Disconnect</button>
  </div>
</section>
<div class="header">
  <div class="header-top">
    <span class="header-title">Workouts</span>
    <span class="header-sub" id="cycleSubtitle">Window --</span>
  </div>
  <div class="cycle-bar">
    <span class="cycle-label">Year</span>
    <div class="cycle-track"><div class="cycle-fill" id="cycleFill" style="width:0%"></div></div>
    <span class="cycle-count" id="cycleCount">Day 1</span>
  </div>
  <div class="status-grid" id="cycleStatus">
    <div class="status-item">
      <span class="status-label" id="yearLabel">Done 2026</span>
      <span class="status-value good" id="completedCount">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">90D Miss</span>
      <span class="status-value warn" id="missedCount">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Performance</span>
      <span class="status-value performance-high" id="nextWorkout">—</span>
    </div>
  </div>
  <div class="consistency-message" id="consistencyMessage" role="status" aria-live="polite" hidden></div>
</div>

<div class="content" id="content"><p class="empty-history">Connect to your private GitHub history to see your workout.</p></div>
<script src="./program.js?v=2026-09-11"></script>
<script src="./history.js?v=2026-09-11-cloud1"></script>
<script src="./sync.js?v=2026-09-11-cloud1"></script>
<script src="./github-store.js?v=2026-09-11-cloud1"></script>
<script src="./cloud.js?v=2026-09-11-cloud1"></script>
</body></html>

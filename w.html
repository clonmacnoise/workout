<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Workout Program</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0d0f; color: #f5f4f8; min-height: 100vh; }
  .app { width: min(760px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 7vw, 40px); line-height: 1.05; letter-spacing: -.04em; }
  .subtitle { margin: 0 0 22px; color: #92919c; font-size: 14px; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(56px, 1fr)); gap: 8px; overflow-x: auto; padding: 2px 0 18px; }
  .day-button { min-width: 56px; border: 1px solid #34343c; border-radius: 10px; padding: 10px 8px; background: #1b1b20; color: #aaa9b3; font: inherit; font-size: 13px; cursor: pointer; }
  .day-button[aria-selected="true"] { background: #766ee6; border-color: #8a83f1; color: white; font-weight: 700; }
  .workout-title { margin: 6px 0 14px; font-size: 20px; }
  .blocks { display: grid; gap: 12px; }
  .block { border: 1px solid #2e2e35; border-radius: 14px; background: #17171b; overflow: hidden; }
  .block-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #29292f; }
  .block-letter { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #766ee6; font-weight: 800; }
  .block-name { font-weight: 700; }
  .sets { margin-left: auto; color: #aaa9b3; font-size: 13px; }
  .exercise { padding: 14px; }
  .exercise + .exercise { border-top: 1px solid #29292f; }
  .exercise-name { margin-bottom: 9px; font-size: 17px; font-weight: 650; }
  .details { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border-radius: 999px; padding: 6px 9px; background: #26262c; color: #c7c6ce; font-size: 13px; }
  .note { background: rgba(29,158,117,.14); color: #55cba3; }
  @media (max-width: 520px) { .days { grid-template-columns: repeat(7, 64px); } }
</style>
</head>
<body>
<main class="app">
  <h1>Workout Program</h1>
  <p class="subtitle">Choose a day to view its exercises.</p>
  <nav id="days" class="days" aria-label="Workout days"></nav>
  <section aria-live="polite">
    <h2 id="workoutTitle" class="workout-title"></h2>
    <div id="blocks" class="blocks"></div>
  </section>
</main>
<script src="./program.js?v=2026-09-11"></script>
<script>
(() => {
  'use strict';
  const workouts = window.WORKOUT_PROGRAM.workouts;
  const days = document.getElementById('days');
  const blocks = document.getElementById('blocks');
  const title = document.getElementById('workoutTitle');

  function render(index) {
    const workout = workouts[index];
    title.textContent = workout.label;
    blocks.innerHTML = workout.blocks.map(block => `
      <article class="block">
        <header class="block-header">
          <span class="block-letter">${block.block}</span>
          <span class="block-name">Block ${block.block}</span>
          <span class="sets">${block.sets} sets</span>
        </header>
        ${block.exercises.map(exercise => `
          <div class="exercise">
            <div class="exercise-name">${exercise.name}</div>
            <div class="details">
              <span class="chip">${exercise.weight}</span>
              <span class="chip">${exercise.reps}</span>
              ${block.note ? `<span class="chip note">${block.note}</span>` : ''}
            </div>
          </div>`).join('')}
      </article>`).join('');
    [...days.children].forEach((button, buttonIndex) => button.setAttribute('aria-selected', String(buttonIndex === index)));
  }

  workouts.forEach((workout, index) => {
    const button = document.createElement('button');
    button.className = 'day-button';
    button.type = 'button';
    button.textContent = workout.label;
    button.addEventListener('click', () => render(index));
    days.appendChild(button);
  });
  render(0);
})();
</script>
</body>
</html>
